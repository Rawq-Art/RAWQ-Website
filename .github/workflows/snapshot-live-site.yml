name: Snapshot live site

on:
  workflow_dispatch:
  push:
    branches:
      - claude/terms-conditions-policy-pages-x8ll3t
    paths:
      - ".github/workflows/snapshot-live-site.yml"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Capture live response headers and clean-URL behavior
        run: |
          {
            echo "== GET / =="
            curl -sSI --max-time 30 https://rawq.art/ || true
            echo
            echo "== GET /pay (clean URL) =="
            curl -sSI --max-time 30 https://rawq.art/pay || true
            echo
            echo "== GET /pay.html =="
            curl -sSI --max-time 30 https://rawq.art/pay.html || true
          } > live-headers.txt
          cat live-headers.txt

      - name: Commit header capture to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f live-headers.txt
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Capture live rawq.art response headers"
            git push origin HEAD:claude/terms-conditions-policy-pages-x8ll3t
          fi
