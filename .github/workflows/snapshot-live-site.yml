name: Snapshot live site

on:
  workflow_dispatch:
  push:
    branches:
      - claude/terms-conditions-policy-pages-x8ll3t
    paths:
      - ".github/workflows/snapshot-live-site.yml"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch assets not captured by the HTML mirror
        run: |
          fetched=0
          for asset in og.png; do
            if curl -fsSL --max-time 30 "https://rawq.art/assets/${asset}" -o "public/assets/${asset}"; then
              echo "fetched ${asset}"
              fetched=1
            else
              echo "${asset} not present on the live site; skipping"
              rm -f "public/assets/${asset}"
            fi
          done

      - name: Commit fetched assets to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/assets
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Add live-site assets fetched by snapshot workflow"
            git push origin HEAD:claude/terms-conditions-policy-pages-x8ll3t
          fi
